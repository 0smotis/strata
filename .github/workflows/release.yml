# Builds the Windows installer on GitHub's Windows runner and publishes it as a release in this (private) repo.
# Triggered by pushing to the `release` branch (or manually). The version comes from package.json: the workflow
# creates tag v<version> and a draft release, electron-builder uploads into it, then it is published.
# Strata's updater reads these releases with the read-only token saved in Preferences › Updates.
name: Release
on:
  push:
    branches: [release]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/vendor.cjs
      - name: Create version tag and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          git tag -f "$V"
          git push -f origin "refs/tags/$V"
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --draft --title "Strata $V" --notes "Strata $V"
      - name: Build and upload installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win nsis --x64 --publish always 2>&1 | tee build.log
      - name: Report build error
        if: failure()
        shell: bash
        run: |
          echo "::error title=electron-builder::$(grep -E '⨯|Error|error' build.log | tail -n 15 | tr '\n' ' ' | cut -c1-3500)"
      - name: Attach source archive and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          git archive --format=zip -o "Strata-source-$V.zip" HEAD
          gh release upload "$V" "Strata-source-$V.zip" --clobber
          ASSETS="$(gh release view "$V" --json assets --jq '.assets[].name')"
          echo "$ASSETS"
          for f in latest.yml "Strata-Setup-${V#v}.exe" "Strata-Setup-${V#v}.exe.blockmap"; do
            grep -qxF "$f" <<<"$ASSETS" || { echo "::error title=release::missing $f"; exit 1; }
          done
          gh release edit "$V" --draft=false --latest
